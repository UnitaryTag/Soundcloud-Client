<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>hls playback spike</title>
    <!-- Spike-only. The real renderer ships a strict CSP; the page script is
         external rather than inline so this stays meaningful. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; media-src 'self' blob:; connect-src 'self'"
    />
  </head>
  <body>
    <audio id="player"></audio>
    <script src="/hls.js"></script>
    <script type="module" src="/page.js"></script>
  </body>
</html>
