<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The renderer makes NO network requests of its own — every call to the
      SoundCloud API goes through IPC to main, which holds the token. So
      `connect-src` only needs the Vite dev server (for HMR); the packaged build
      should drop it entirely.

      `media-src blob:` is required for MSE SourceBuffers, which is how audio
      reaches the speakers without ever being written to disk.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.sndcdn.com; media-src 'self' blob:; connect-src 'self' ws://localhost:* http://localhost:*; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>SoundCloud Client</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
